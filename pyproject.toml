[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sungrow-modbus"
# Keep in lockstep with `requirements` in
# custom_components/sungrow_modbus/manifest.json: Home Assistant checks the
# installed version against it on every start.
version = "0.1.0a18"
description = "Talk to Sungrow inverters, batteries and wallboxes over Modbus."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Martin Kaiser" }]
keywords = ["modbus", "sungrow", "inverter", "solar"]
dependencies = ["modbus-connection>=4.10.0"]

[project.optional-dependencies]
discovery = ["zeroconf>=0.39.0"]

[project.urls]
Homepage = "https://github.com/mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant"

[tool.hatch.build.targets.wheel]
packages = ["src/sungrow_modbus"]

# Without this the sdist sweeps in everything not gitignored — the YAML
# package, the dashboards and doc/images take it past 6 MB, for a library
# whose wheel is a fraction of that. The sdist should be the library and what it needs to
# be built and understood, nothing else.
[tool.hatch.build.targets.sdist]
# Anchored with a leading slash. Hatchling treats these as gitignore-style
# patterns, so a bare "README.md" matches at every depth and sweeps the
# dashboard READMEs under legacy/ into the library's sdist.
include = [
    "/src/sungrow_modbus",
    "/tests/test_device.py",
    "/tests/conftest.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
target-version = "py313"
# The YAML package's helper scripts -- legacy/debug and the multi-inverter
# generator -- predate this tooling; linting them is a separate job from the
# integration's.
extend-exclude = [".reference", "debug", "scripts/generate/generate_second_inverter_config.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
# E402 here rather than as a `# noqa` on the import: with the comment the line
# sits exactly where ruff 0.16 and 0.17 disagree about wrapping it, so each
# version's isort rejects the other's output and CI fails on a ruff upgrade.
"tests/test_firmware_attribution.py" = ["D100", "D103", "E402"]

[tool.ruff.lint.isort]
# Mirrors Home Assistant core's isort settings, so the integration reads the
# same way as the core integrations it is modelled on and could be moved there
# without a reshuffle.
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.13"
packages = ["sungrow_modbus"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

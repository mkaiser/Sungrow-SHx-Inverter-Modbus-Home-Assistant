# Validation for the new custom integration and its device library.
# The YAML package has its own workflows and is untouched by this one.
name: Validate integration

on:
  push:
    branches: [main, proper-ha-integration]
    paths:
      - "custom_components/**"
      - "src/**"
      - "tests/**"
      # tests/test_makefile.py reads both, and asserts the generator list
      # below matches the one in the Makefile.
      - "Makefile"
      - "scripts/*.sh"
      - "scripts/simulator.py"
      - "scripts/gen_simulator_registers.py"
      - "pyproject.toml"
      - "requirements_dev.txt"
      - "hacs.json"
      - "legacy/modbus_sungrow.yaml"
      - "doc/legacy_entity_map.json"
      - "scripts/sync_version.py"
      - "scripts/generate_entity_map.py"
      - "scripts/generate_registers.py"
      - "scripts/generate_sensors.py"
      - "scripts/generate_derived.py"
      - "scripts/generate_strings.py"
      - "scripts/naming.py"
      - "scripts/writes.py"
      - "scripts/generate_numbers.py"
      - "scripts/generate_switches.py"
      - "scripts/generate_selects.py"
      - "scripts/generate_compatibility.py"
      # The scanning scripts, absent until now, and layout.py, which feeds
      # generate_registers.py. Only the push event is filtered -- pull
      # requests run everything regardless -- so the gap only ever let a
      # direct push to a protected branch skip validation.
      - "scripts/sungrow_scan/**"
      - "scripts/generate_scan_plan.py"
      - "scripts/layout.py"
      - "doc/device-fingerprints/**"
      - "LICENSE"
      - "README.md"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements_dev.txt
      - name: Versions in lockstep
        run: python scripts/sync_version.py --check
      - name: The legacy entity map matches the YAML package
        run: python scripts/generate_entity_map.py --check
      - name: The register map matches the entity map
        run: python scripts/generate_registers.py --check
      - name: The sensor descriptions match the entity map
        run: python scripts/generate_sensors.py --check

      - name: The scan plan matches the library
        run: python scripts/generate_scan_plan.py --check
      # The zip is the claim that this directory needs nothing installed, and
      # it is the claim most easily broken by a convenient import. The AST
      # test in pytest reads the imports; this unpacks the built zip and runs
      # it with a bare interpreter, which is the half that cannot be fooled.
      - name: The scan directory runs from a zip with nothing installed
        run: python scripts/make_scan_zip.py --verify
      - name: The derived descriptions are current
        run: python scripts/generate_derived.py --check
      - name: The writable registers match the write table
        run: |
          python scripts/generate_numbers.py --check
          python scripts/generate_switches.py --check
          python scripts/generate_selects.py --check
      - name: The entity names follow the naming convention
        run: python scripts/generate_strings.py --check
      - name: The compatibility page matches the fingerprints
        run: python scripts/generate_compatibility.py --check
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q

      # The release workflow is the only thing that packages the library, and
      # it runs once, on a tag, against an index where uploads are immutable.
      # That makes the first real publish the worst possible moment to find
      # out the package does not build. This is the same two steps, ten
      # seconds, and touches no external service.
      #
      # It does NOT prove trusted publishing works -- only an upload does
      # that. Rehearse the handshake with the manual "Rehearse the PyPI
      # publish" workflow before tagging.
      - name: The library still packages
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
